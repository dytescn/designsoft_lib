[package]
name = "designsoft"
version = "1.0.3"
edition = "2021"
description = "Detect, inspect and launch design software installed on Windows."
license = "MIT"

# 编译为动态库（供外部系统通过 C ABI 调用），同时保留 rlib 以便测试。
[lib]
crate-type = ["cdylib", "rlib"]
name = "designsoft"

[dependencies]
cdrsdk = "1.0.0"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 本库仅支持 Windows：依赖注册表、进程与 MSI 相关 API。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
